<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ محمود فاروق</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url("./Screenshot (53).png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* توزيع العناصر: فوق، في النص، وتحت */
            align-items: center;
            padding: 20px 10px;
        }

        /* 1. العنوان في أعلى الصفحة */
        h1 {
            border: 4px solid rgb(45, 8, 104);
            width: 90%;
            max-width: 550px;
            text-align: center;
            background-color: rgba(162, 165, 158, 0.95);
            padding: 10px 20px;
            font-size: clamp(18px, 3.5vw, 26px);
            font-weight: bold;
        }

        /* 2. كارت الرياضيات بالسبورة في المنتصف */
        .middle-section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        }

        .math-card {
            width: 100%;
            max-width: 480px;
            height: 260px;
            background-image: url("./Screenshot (49).png"); /* صورة السبورة */
            background-position: center;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .math-card button {
            width: 180px;
            height: 80px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(240, 240, 240, 0.95);
            border: 1px solid #777;
            cursor: pointer;
            transition: 0.3s;
        }

        .math-card button:hover {
            background-color: rgba(45, 8, 104, 0.85);
            color: white;
        }

        /* 3. شريط أزرار التواصل في أسفل الصفحة */
        .bottom-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 10px;
        }

        .bottom-buttons button {
            flex: 1 1 160px;
            max-width: 200px;
            height: 80px;
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(240, 240, 240, 0.95);
            border: 1px solid #777;
            cursor: pointer;
            transition: 0.3s;
        }

        .bottom-buttons button:hover {
            background-color: rgba(45, 8, 104, 0.85);
            color: white;
        }

        /* --- تعديلات شاشة الموبايل --- */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start;
                gap: 20px;
            }

            .math-card {
                max-width: 330px;
                height: 190px;
            }

            .math-card button {
                width: 140px;
                height: 60px;
                font-size: 17px;
            }

            .bottom-buttons button {
                flex: 1 1 42%; /* ينزل كل زرين جنب بعض على الشاشات الصغيره بانتظام */
                max-width: 100%;
                height: 60px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- الجزء العلوي -->
    <h1>منصه الاستاذ محمود فاروق</h1>

    <!-- الجزء الأوسط (زر الرياضيات داخل السبورة) -->
    <div class="middle-section">
        <div class="math-card">
            <button onclick="window.location.href='math.html'">الرياضيات</button>
        </div>
    </div>

    <!-- الجزء السفلي (أزرار التواصل) -->
    <div class="bottom-buttons">
        <button onclick="window.open('https://mail.google.com/mail/?view=cm&fs=1&to=alansh3ltlymyhllastadhmhwmdfar@gmail.com', '_blank')">بريدًا إلكترونيًا</button>
        <button onclick="window.location.href='https://linktr.ee/almnshaltlymyhllastadhmhmwdfar'">جميع وسائل التواصل</button>
        <button onclick="window.location.href='https://www.instagram.com/mnshlstdhmhmwd/'">Instagram</button>
        <button onclick="window.location.href='https://www.facebook.com/profile.php?id=61593142946300&locale=ar_AR'">فيس بوك</button>
        <button onclick="window.location.href='https://twitter.com/almnshaltlymyhllastadhmhmwdfar'">يوت يوب</button>
        <button onclick="window.location.href='https://t.me/mahmod765y8'">تلجرام</button>
    </div>

</body>

</html>
